name: Draft tagged release

# Publishing is a separate owner-approved action. Never create public
# releases automatically from ordinary commits or unreviewed PRs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Previously approved vX.Y.Z Git tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Verify approved tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag" >&2
            exit 2
          fi
          git rev-parse --verify "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          test "$(git status --porcelain)" = ""
      - name: Install Qt host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Prepare environment
        run: bash scripts/setup_env.sh
      - name: Quality gate and Debian-only package checks
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: |
          bash scripts/local_gate.sh
          bash packaging/debian/build.sh
          bash packaging/debian/test_deb.sh
      - name: Create GitHub Release draft (manual publish later)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.deb dist/SHA256SUMS \
            --verify-tag --draft --generate-notes \
            --title "WG Deck $TAG"
